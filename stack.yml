services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1

  backend:
    image: ghcr.io/${GH_REPO:-nekotyan2d/project-bee}-backend:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-bee}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-bee}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=*
      - TRUST_PROXY=uniquelocal
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

  frontend:
    image: ghcr.io/${GH_REPO:-nekotyan2d/project-bee}-frontend:${IMAGE_TAG:-latest}
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik"

        - "traefik.http.routers.paseka.rule=Host(`paseka.nekotyan2d.ru`)"
        - "traefik.http.routers.paseka.entrypoints=websecure"
        - "traefik.http.routers.paseka.tls=true"
        - "traefik.http.routers.paseka.tls.certresolver=letsencrypt"
        - "traefik.http.services.paseka.loadbalancer.server.port=80"
    networks:
      - traefik
      - internal

networks:
  traefik:
    external: true
  internal:
    driver: overlay

volumes:
  pgdata:
