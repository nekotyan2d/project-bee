<style>
	#spa-loader {
		position: fixed;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #fafaf9;
	}

	@media (prefers-color-scheme: dark) {
		#spa-loader {
			background: #0c0a09;
		}
	}

	.spa-spinner {
		width: 36px;
		height: 36px;
		border: 3px solid transparent;
		border-top-color: #d97706;
		border-radius: 50%;
		animation: spin 0.7s linear infinite;
	}

	@keyframes spin {
		to {
			transform: rotate(360deg);
		}
	}
</style>
<div id="spa-loader">
	<div class="spa-spinner"></div>
</div>
